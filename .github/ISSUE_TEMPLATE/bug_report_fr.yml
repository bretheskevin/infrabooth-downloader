name: "Rapport de bug (Français)"
description: "Signaler un bug pour nous aider à améliorer l'application. Ne signalez PAS de vulnérabilité de sécurité ici — envoyez un email à k.brethes@myunisoft.fr."
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Que s'est-il passé ?"
      placeholder: "Une description claire du bug..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Étapes pour reproduire"
      description: "Comment reproduire ce bug ?"
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer l'erreur...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
      description: "Que devait-il se passer ?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version de l'application"
      description: "Rempli automatiquement par l'application"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "Plateforme"
      description: "Rempli automatiquement par l'application"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Contexte supplémentaire"
      description: "Captures d'écran, logs ou toute autre information"
    validations:
      required: false
