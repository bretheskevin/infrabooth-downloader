name: "Bug Report (English)"
description: "Report a bug to help us improve. Do NOT report security vulnerabilities here — email k.brethes@myunisoft.fr instead."
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What happened?"
      placeholder: "A clear description of the bug..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce this?"
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "App Version"
      description: "Automatically filled by the app"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "Platform"
      description: "Automatically filled by the app"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Screenshots, logs, or anything else"
    validations:
      required: false
