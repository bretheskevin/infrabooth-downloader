name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Check changelog exists
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}

          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::No changelog entry found for version ${VERSION}"
            echo "Please add a changelog entry in CHANGELOG.md for version ${VERSION}"
            exit 1
          fi

          # Extract changelog content for this version
          CONTENT=$(awk "/## \[${VERSION}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)

          if [ -z "$CONTENT" ]; then
            echo "::error::Changelog entry for version ${VERSION} is empty"
            exit 1
          fi

          echo "Found changelog for version ${VERSION}"
          echo "$CONTENT"

          # Save to output (escape newlines)
          {
            echo 'content<<EOF'
            echo "$CONTENT"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  build:
    needs: check-changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            name: Apple_Silicon
          - platform: macos-14
            target: x86_64-apple-darwin
            name: Intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          vcpkg install openssl:x64-windows-static-md
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          echo "OPENSSL_LIB_DIR=$root\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows: allow duplicate OpenSSL/BoringSSL symbols (rquest uses BoringSSL, SQLCipher uses OpenSSL)
          RUSTFLAGS: ${{ matrix.platform == 'windows-latest' && '-Clink-args=/FORCE:MULTIPLE' || '' }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Rename macOS artifacts
        if: contains(matrix.platform, 'macos')
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          # Create output directory
          mkdir -p output

          # Copy and rename DMG
          DMG_FILE=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "output/InfraBooth_Downloader_${VERSION}_${{ matrix.name }}.dmg"
          fi

          # Copy and rename updater tarball
          if [ -f "$BUNDLE_DIR/macos/InfraBooth Downloader.app.tar.gz" ]; then
            cp "$BUNDLE_DIR/macos/InfraBooth Downloader.app.tar.gz" \
               "output/InfraBooth_Downloader_${VERSION}_${{ matrix.name }}.app.tar.gz"
            cp "$BUNDLE_DIR/macos/InfraBooth Downloader.app.tar.gz.sig" \
               "output/InfraBooth_Downloader_${VERSION}_${{ matrix.name }}.app.tar.gz.sig"
          fi

          ls -la output/

      - name: Rename Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          mkdir -p output

          EXE_FILE=$(find "$BUNDLE_DIR/nsis" -name "*-setup.exe" | head -1)
          if [ -n "$EXE_FILE" ]; then
            cp "$EXE_FILE" "output/InfraBooth.Downloader_${VERSION}_x64-setup.exe"
            if [ -f "${EXE_FILE}.sig" ]; then
              cp "${EXE_FILE}.sig" "output/InfraBooth.Downloader_${VERSION}_x64-setup.exe.sig"
            fi
          fi

          ls -la output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: output/*

  release:
    needs: [check-changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --release-dir release \
            > release/latest.json
          cat release/latest.json

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: InfraBooth Downloader v${{ steps.version.outputs.version }}
          draft: false
          body: |
            ## What's New

            ${{ needs.check-changelog.outputs.changelog }}

            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `InfraBooth_Downloader_${{ steps.version.outputs.version }}_Apple_Silicon.dmg` |
            | macOS (Intel) | `InfraBooth_Downloader_${{ steps.version.outputs.version }}_Intel.dmg` |
            | Windows | `InfraBooth.Downloader_${{ steps.version.outputs.version }}_x64-setup.exe` |
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
